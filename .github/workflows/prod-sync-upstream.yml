name: Sync Upstream

# GitHub expression string literals must be single-quoted; double quotes are a
# syntax error there even though YAML accepts them.
run-name: 🔄 Sync upstream${{ inputs.ref && format(' ({0})', inputs.ref) || '' }} → PR to prod${{ inputs.ops_request_id && format(' [{0}]', inputs.ops_request_id) || '' }}

# Watches diegosouzapw/OmniRoute and opens a PR that merges its newest code
# into this fork's `prod` branch. Merging that PR pushes `prod`, which triggers
# Production Deploy.
#
# A PR rather than a direct push on purpose: the default source is upstream's
# active release/* development branch, which is CI-gated but not frozen. You
# get to look at the diff and the version bump before it ships.

on:
  schedule:
    # 04:00 UTC on Mondays.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to sync (blank = newest release/v* branch; or 'main', or a tag like v3.8.50)"
        required: false
        type: string
      ops_request_id:
        description: "Optional Telegram Ops correlation ID"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omniroute-upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest

    steps:
      - name: 1 Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod
          # Full history: the merge needs the common ancestor with upstream.
          fetch-depth: 0

      - name: 2 Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git
          git fetch upstream --prune --tags

      - name: 3 Pick newest release/v* branch
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"

          if [ -z "$REF" ]; then
            # sort -V compares numeric segments, so release/v3.8.9 sorts BELOW
            # release/v3.8.50. A lexicographic sort would pick the wrong branch.
            REF="$(git branch -r --list 'upstream/release/v*' \
                   | sed 's#^[[:space:]]*upstream/##' \
                   | sort -V | tail -n1)"
            echo "Newest upstream release branch: $REF"
          fi

          if git rev-parse --verify --quiet "upstream/$REF" >/dev/null; then
            MERGE_REF="upstream/$REF"
          elif git rev-parse --verify --quiet "refs/tags/$REF" >/dev/null; then
            MERGE_REF="refs/tags/$REF"
          else
            echo "::error::cannot resolve '$REF' as an upstream branch or tag"
            exit 1
          fi

          BEHIND="$(git rev-list --count "HEAD..$MERGE_REF")"
          NEW_VER="$(git show "$MERGE_REF:package.json" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)"

          # Slashes are legal in a branch name but make for awkward PR titles.
          SLUG="$(printf '%s' "$REF" | tr '/' '-')"

          {
            echo "merge_ref=$MERGE_REF"
            echo "ref=$REF"
            echo "behind=$BEHIND"
            echo "new_version=$NEW_VER"
            echo "branch=sync/upstream-$SLUG"
          } >> "$GITHUB_OUTPUT"

          echo "$MERGE_REF is $BEHIND commit(s) ahead of prod (version $NEW_VER)"

      - name: 4 Nothing new — stop
        if: steps.ref.outputs.behind == '0'
        run: echo "prod already contains ${{ steps.ref.outputs.merge_ref }} — no PR needed."

      - name: 5 Merge onto sync branch
        id: merge
        if: steps.ref.outputs.behind != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${{ steps.ref.outputs.branch }}"

          if ! git merge --no-edit "${{ steps.ref.outputs.merge_ref }}"; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::Merge conflict with ${{ steps.ref.outputs.merge_ref }}. Resolve locally: infra/sync-upstream.sh"
            exit 1
          fi

          git push --force-with-lease origin "${{ steps.ref.outputs.branch }}"

      - name: 6 Open or update PR
        if: steps.ref.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ref.outputs.branch }}
          MERGE_REF: ${{ steps.ref.outputs.merge_ref }}
          BEHIND: ${{ steps.ref.outputs.behind }}
          NEW_VER: ${{ steps.ref.outputs.new_version }}
        run: |
          set -euo pipefail

          BODY=$(cat <<EOF
          Merges \`$MERGE_REF\` ($BEHIND commit(s)) into \`prod\`.

          **OmniRoute version after merge: \`$NEW_VER\`**

          Merging this PR pushes \`prod\`, which triggers **Production Deploy**:
          build → GHCR → blue/green switch on the VPS.

          Before merging, check that upstream's build is green for this ref —
          \`release/*\` is the active development branch, not a frozen release.
          EOF
          )

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "sync: upstream $MERGE_REF (v$NEW_VER)" --body "$BODY"
            echo "Updated existing PR."
          else
            gh pr create --base prod --head "$BRANCH" \
              --title "sync: upstream $MERGE_REF (v$NEW_VER)" \
              --body "$BODY"
          fi
