name: VPS deployment operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
permissions:
  contents: read
jobs:
  operate:
    concurrency:
      group: ${{ inputs.operation == 'status' && format('omniroute-status-{0}', github.run_id) || 'omniroute-oracle-main-production' }}
      queue: max
      cancel-in-progress: false
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 17
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@608c67253ad9a65024f278b385b860c585de8e67
        with:
          app: omniroute
          host: oracle-main
          operation: ${{ inputs.operation }}
          component: app
          source-sha: ${{ github.sha }}
          platform-ref: 608c67253ad9a65024f278b385b860c585de8e67
          config: .deploy/app.yml
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
