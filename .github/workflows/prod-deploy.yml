name: Production Deploy

# The run title in the Actions list. Without this GitHub uses the commit
# message, which says what changed but not what the run is about to do —
# and every run in the list then looks like a code change rather than a deploy.
# On a `push` event `inputs.skip_deploy` is empty, so the deploy variant wins.
run-name: ${{ inputs.skip_deploy && '🔨 Build only — no deploy' || '🚀 Build → GHCR → Deploy VPS' }}${{ inputs.ops_request_id && format(' [{0}]', inputs.ops_request_id) || '' }}

# Builds the fork's own OmniRoute image and deploys it to the VPS by immutable
# digest. Runs only for the `prod` branch — upstream's own workflows keep their
# triggers and are expected to be disabled in this fork (see infra/README.md).

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and push the image, but do not deploy"
        required: false
        type: boolean
        default: false
      ops_request_id:
        description: "Optional Telegram Ops correlation ID"
        required: false
        type: string
        default: ""

# Never let two deployments interleave: deploy.sh takes a flock on the VPS and
# the second one would simply fail. cancel-in-progress stays false so a running
# deploy is allowed to finish rather than being killed mid-switch.
concurrency:
  group: omniroute-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The ops bot is not part of the container image — step 2.3 copies it straight
  # onto the VPS — so nothing else in this pipeline would ever have exercised it.
  # Runs alongside the build, and gates only the deploy: a bot regression must
  # not reach the box, but it also should not hold back an application hotfix
  # any longer than the ~30s this takes.
  ops-bot-tests:
    name: 0 · Test Telegram Ops Bot
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 0.1 Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 0.2 Run the ops bot unit suite
        # Standard library unittest, no dependencies to install. `-t .` keeps the
        # repo root on sys.path so `scripts.ops.telegram_ops_bot` resolves.
        run: python3 -m unittest discover -s tests/unit/ops -t . -v

  build:
    name: 1 · Build image → GHCR
    # Must match the VPS architecture. A native arm64 runner builds in minutes;
    # `platforms: linux/arm64` on an x86 runner falls back to QEMU emulation and
    # takes hours. GitHub-hosted arm64 runners are free on public repositories.
    # Set the BUILD_RUNNER repo variable to `ubuntu-24.04-arm` for an aarch64 VPS.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: 1.1 Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Next.js production build peaks well above the runner's RAM on a
      # codebase this size (upstream's own build.yml does the same thing before
      # `npm run build`). Without the swap file the builder stage dies with
      # "JavaScript heap out of memory".
      - name: 1.2 Add 10GB swap (Next.js build needs it)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # node_modules + Next build output + Docker layers overflow the default
      # runner disk. Drop the preinstalled toolchains this build never touches.
      - name: 1.3 Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 1.4 Resolve image name + version
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase in a repository path, and GitHub usernames
          # are not necessarily lowercase.
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/omniroute"
          VERSION="$(node -p "require('./package.json').version")"
          echo "image=$IMAGE"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE (OmniRoute $VERSION)"

      - name: 1.5 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 1.6 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 1.7 Build image and push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bun
          push: true

          # runner-base is the lean flavour and matches upstream's :latest.
          # Switch to runner-web only if you need the web-cookie providers
          # (gemini-web, claude-web, claude-turnstile) — it adds ~300 MB of
          # Chromium. runner-cli additionally bundles CLI agents and docker.io.
          target: ${{ vars.IMAGE_TARGET || 'runner-base' }}

          # Build ONLY the VPS's architecture. Emulated cross-builds of this
          # image take hours. Set the DEPLOY_PLATFORM repo variable to
          # linux/arm64 if `uname -m` on the VPS says aarch64.
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}

          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_USE_TURBOPACK=1

          # The digest below is what actually gets deployed. These tags exist
          # for humans reading the package page.
          tags: |
            ${{ steps.meta.outputs.image }}:prod
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 1.8 Print image digest
        run: |
          {
            echo "### Image built"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "OmniRoute version: **${{ steps.meta.outputs.version }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 2 · Deploy to VPS
    needs: [build, ops-bot-tests]
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest

    # `packages: read` is what lets step 2.3b mint a short-lived GHCR pull
    # credential for the VPS. Without it the VPS would need a long-lived PAT
    # stored in ~/.docker/config.json forever.
    permissions:
      contents: read
      packages: read

    # Requires an environment named `production` holding the VPS_* secrets.
    # Add required reviewers there if you want deploys to be gated by approval.
    environment:
      name: production

    steps:
      - name: 2.1 Checkout source (for infra/)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2.2 Configure SSH from secrets
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # Without this the VPS would keep whatever bootstrap-vps.sh installed the
      # first time, and any later change to compose.yml / Caddyfile / deploy.sh
      # would silently never reach production.
      #
      # caddy/active.caddy is deliberately NOT synced: it is generated state
      # owned by deploy.sh and names the currently live slot. Overwriting it
      # from the repo seed would repoint traffic at the wrong container.
      - name: 2.3 Sync infra files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT -o BatchMode=yes -o ConnectTimeout=20"
          $SSH "$VPS_USER@$VPS_HOST" 'rm -rf /opt/omniroute/.staging && mkdir -p /opt/omniroute/.staging'

          tar -czf /tmp/omniroute-infra.tgz \
              infra/compose.yml infra/deploy.sh infra/backup.sh infra/caddy/Caddyfile \
              infra/systemd/omniroute-ops-bot.service infra/sudoers/omniroute-ops-bot \
              scripts/ops/omniroute_opsctl.py scripts/ops/telegram_ops_bot
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
              /tmp/omniroute-infra.tgz \
              "$VPS_USER@$VPS_HOST:/opt/omniroute/.staging/"
          $SSH "$VPS_USER@$VPS_HOST" \
              'tar -xzf /opt/omniroute/.staging/omniroute-infra.tgz -C /opt/omniroute/.staging'

          # Install by rename, not by overwrite. `mv` within one filesystem is an
          # atomic swap of the directory entry, so a deploy.sh that happens to be
          # executing keeps reading its original inode. Copying in place would let
          # bash read half of the old script and half of the new one.
          $SSH "$VPS_USER@$VPS_HOST" "GITHUB_SHA=${GITHUB_SHA}"' bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/omniroute
            install -m 0644 .staging/infra/compose.yml compose.yml.new && mv -f compose.yml.new compose.yml
            install -m 0644 .staging/infra/caddy/Caddyfile caddy/Caddyfile.new && mv -f caddy/Caddyfile.new caddy/Caddyfile
            install -m 0750 .staging/infra/deploy.sh deploy.sh.new && mv -f deploy.sh.new deploy.sh
            install -m 0750 .staging/infra/backup.sh backup.sh.new && mv -f backup.sh.new backup.sh

            BOT_RELEASE="releases/${GITHUB_SHA:?missing GITHUB_SHA}"
            sudo mkdir -p "ops-bot/$BOT_RELEASE"
            sudo cp -a .staging/scripts/ops/telegram_ops_bot/. "ops-bot/$BOT_RELEASE/"
            sudo chown -R root:root "ops-bot/$BOT_RELEASE"
            sudo find "ops-bot/$BOT_RELEASE" -type d -exec chmod 0755 {} +
            sudo find "ops-bot/$BOT_RELEASE" -type f -exec chmod 0644 {} +
            install -m 0755 .staging/scripts/ops/omniroute_opsctl.py opsctl.new
            sudo install -o root -g root -m 0755 opsctl.new /usr/local/sbin/omniroute-opsctl
            rm -f opsctl.new
            sudo install -o root -g root -m 0644 \
              .staging/infra/systemd/omniroute-ops-bot.service \
              /etc/systemd/system/omniroute-ops-bot.service
            sudo install -o root -g root -m 0440 \
              .staging/infra/sudoers/omniroute-ops-bot \
              /etc/sudoers.d/omniroute-ops-bot
            sudo visudo -cf /etc/sudoers.d/omniroute-ops-bot
            sudo ln -sfn "$BOT_RELEASE" ops-bot/current
            sudo systemctl daemon-reload
            if sudo test -s /etc/omniroute/ops-bot.env; then
              sudo systemctl try-restart omniroute-ops-bot.service || true
            fi
            rm -rf .staging
            echo "infra and Telegram Ops Bot files synced"
          REMOTE

      # The image is private, so the VPS must authenticate to pull it. Rather
      # than parking a long-lived PAT on the box, hand it this job's own
      # GITHUB_TOKEN: it carries `packages: read`, it is minted per run, and it
      # is revoked the moment the job ends. Step 2.6 logs out regardless of
      # outcome so nothing is left in ~/.docker/config.json between deploys.
      #
      # The token goes over stdin, never as an argv element — arguments are
      # visible in the VPS process table to any local user while the command runs.
      - name: 2.3b Log the VPS in to GHCR (ephemeral)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: 2.4 Run deploy.sh (blue/green switch)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Deploying $IMAGE_REF"
          # The digest is passed as a positional argument, not interpolated into
          # the remote script body. deploy.sh re-validates its shape before use.
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" \
              "/opt/omniroute/deploy.sh '$IMAGE_REF'"

      - name: 2.5 Report active slot
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" \
              "/opt/omniroute/deploy.sh --status" || true

      - name: 2.6 Log the VPS out of GHCR
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io' || true
