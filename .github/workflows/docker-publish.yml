name: Publish to Docker Hub

on:
  push:
    branches:
      - main
      - "release/v*"
      - prod
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/**"
  # Use 'released' instead of 'published' so editing/re-publishing old releases
  # does NOT re-trigger this workflow. 'released' fires only on the initial
  # release publication (and pre-release → release transition).
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. 3.8.4)"
        required: true
        type: string
      promote_latest:
        description: "Also tag :latest (only if this is the highest semver)"
        required: false
        type: boolean
        default: false

# Least-privilege default: read-only at the top level; the build and merge jobs that
# push to GHCR grant packages: write themselves (Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      promote_latest: ${{ steps.version.outputs.promote_latest }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'thedemontuan/omniroute' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          # Need full tag history for semver comparison when deciding :latest.
          fetch-depth: 0

      - name: Resolve version, latest-promotion, and skip flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          PROMOTE_INPUT: ${{ inputs.promote_latest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # 1) Resolve version/channel from the trigger.
          VERSION=$(bash scripts/ci/resolve-docker-publish-version.sh \
            "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" "$INPUT_VERSION" "$DEFAULT_BRANCH")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 2) Decide :latest promotion
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROMOTE="${PROMOTE_INPUT:-false}"
          else
            git fetch --tags --quiet || true
            PROMOTE=$(git tag -l 'v[0-9]*' | bash scripts/ci/should-promote-latest.sh "$VERSION")
            if [ "$PROMOTE" != "true" ]; then
              echo "Version $VERSION is not the highest stable semver. Not promoting :latest."
            fi
          fi
          echo "promote_latest=$PROMOTE" >> "$GITHUB_OUTPUT"

          # 3) Skip immutable version tags that already exist. Floating `main`, `prod`
          # and `next` channels are intentionally rebuilt on every matching push.
          SKIP="false"
          if [ "$VERSION" != "main" ] && [ "$VERSION" != "prod" ] && [ "$VERSION" != "next" ]; then
            if docker manifest inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
              echo "Image ${IMAGE_NAME}:${VERSION} already exists on Docker Hub — skipping rebuild."
              SKIP="true"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

          echo "Publishing ${IMAGE_NAME}:$VERSION (promote_latest=$PROMOTE, skip=$SKIP)"

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'thedemontuan/omniroute' }}
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Bun 1.4 Native Images (Production Bun-First) ────────────────────────
      - name: Build and push BUN base platform image by digest
        id: build-bun-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bun
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-bun-base-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-bun-base-${{ matrix.arch }},mode=max
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Build and push BUN web platform image by digest
        id: build-bun-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bun
          target: runner-web
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-bun-web-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-bun-web-${{ matrix.arch }},mode=max
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Export digests
        env:
          DIGEST_BUN_BASE: ${{ steps.build-bun-base.outputs.digest }}
          DIGEST_BUN_WEB: ${{ steps.build-bun-web.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/bun-base /tmp/digests/bun-web
          touch "/tmp/digests/bun-base/${DIGEST_BUN_BASE#sha256:}"
          touch "/tmp/digests/bun-web/${DIGEST_BUN_WEB#sha256:}"

      - name: Upload bun-base digests
        uses: actions/upload-artifact@v8
        with:
          name: digests-bun-base-${{ matrix.arch }}
          path: /tmp/digests/bun-base/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload bun-web digests
        uses: actions/upload-artifact@v8
        with:
          name: digests-bun-web-${{ matrix.arch }}
          path: /tmp/digests/bun-web/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'thedemontuan/omniroute' }}
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/omniroute
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bun-base digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-bun-base-*
          path: /tmp/digests/bun-base
          merge-multiple: true

      - name: Download bun-web digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-bun-web-*
          path: /tmp/digests/bun-web
          merge-multiple: true

      - name: Create Docker Hub manifest
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local tags=(-t "${image}:${VERSION}${suffix}")
            if [ "$PROMOTE_LATEST" = "true" ]; then
              tags+=(-t "${image}:latest${suffix}")
            fi
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            if [ "${#refs[@]}" -eq 0 ]; then
              echo "No image digests in $dir" >&2
              exit 1
            fi
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          }

          create_manifest "${IMAGE_NAME}" "" /tmp/digests/bun-base
          create_manifest "${IMAGE_NAME}" "-bun" /tmp/digests/bun-base
          create_manifest "${IMAGE_NAME}" "-web" /tmp/digests/bun-web
          create_manifest "${IMAGE_NAME}" "-web-bun" /tmp/digests/bun-web
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Create GHCR manifest
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local tags=(-t "${image}:${VERSION}${suffix}")
            if [ "$PROMOTE_LATEST" = "true" ]; then
              tags+=(-t "${image}:latest${suffix}")
            fi
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            if [ "${#refs[@]}" -eq 0 ]; then
              echo "No image digests in $dir" >&2
              exit 1
            fi
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          }

          create_manifest "${GHCR_IMAGE_NAME}" "" /tmp/digests/bun-base
          create_manifest "${GHCR_IMAGE_NAME}" "-bun" /tmp/digests/bun-base
          create_manifest "${GHCR_IMAGE_NAME}" "-web" /tmp/digests/bun-web
          create_manifest "${GHCR_IMAGE_NAME}" "-web-bun" /tmp/digests/bun-web

      - name: Inspect image
        if: needs.prepare.outputs.version != 'main' && needs.prepare.outputs.version != 'prod'
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE_NAME}:${VERSION}"

      - name: Generate CycloneDX SBOM (image, advisory)
        if: needs.prepare.outputs.version != 'main' && needs.prepare.outputs.version != 'prod'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json

      - name: Trivy image scan (SARIF, advisory)
        if: needs.prepare.outputs.version != 'main' && needs.prepare.outputs.version != 'prod'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        if: needs.prepare.outputs.version != 'main' && needs.prepare.outputs.version != 'prod'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: docker-image-trivy
