# ──────────────────────────────────────────────────────────────────────────────
#  OmniRoute — Production stack (Blue/Green + Caddy + Cloudflare Tunnel)
#
#  Lives on the VPS at /opt/omniroute/compose.yml
#  All paths below are relative to that directory.
#
#  IMPORTANT — SQLite single-writer discipline:
#    OmniRoute stores everything in $DATA_DIR/storage.sqlite. There is no
#    Postgres/MySQL adapter and no leader election, so only ONE slot may run
#    for any sustained period. deploy.sh keeps blue and green alive together
#    for the warm-up + stabilization window only (~60-90s), then stops the old
#    slot. Never `docker compose up -d` the whole file by hand — that would
#    start both slots permanently.
# ──────────────────────────────────────────────────────────────────────────────

name: omniroute

# Environment shared by both slots. Anchored rather than repeated per service so
# the shutdown budget cannot drift between blue and green.
x-app-env: &app-env
  # How long the app keeps draining in-flight requests after SIGTERM before it
  # force-exits (src/lib/gracefulShutdown.ts). It resolves the moment the last
  # tracked request finishes, so a large value costs nothing on an idle slot —
  # it only matters when a long SSE completion is still streaming.
  #
  # MUST stay BELOW stop_grace_period below. If Docker SIGKILLs first, cleanup()
  # never runs and storage.sqlite is left with an un-checkpointed WAL.
  SHUTDOWN_TIMEOUT_MS: "120000"

x-app: &app
  restart: unless-stopped
  init: true

  env_file:
    - .app.env

  expose:
    - "20128"

  volumes:
    # Bind mount (not a named volume) so infra/backup.sh can run sqlite3 .backup
    # against the live file from the host. Must be owned by UID/GID 1000 (`node`).
    #
    # `:z` = shared SELinux relabel. Required on RHEL-family hosts (Oracle Linux,
    # Rocky, Alma, Fedora) where SELinux runs Enforcing and would otherwise deny
    # the container every write to storage.sqlite. It must be `z` (shared), not
    # `Z` (private): blue and green mount the same directory, and `Z` would give
    # each slot an exclusive label the other cannot read. On hosts without
    # SELinux (Debian/Ubuntu) Docker ignores the flag, so it is safe everywhere.
    - ./data:/app/data:z

  # The image already ships a HEALTHCHECK probing /healthz (pure in-memory
  # lifecycle check, no DB access — see scripts/dev/healthcheck.mjs). It is
  # restated here only to widen start_period: a cold OmniRoute boot runs
  # migrations and rebuilds the model catalog and can exceed the image default.
  healthcheck:
    test: ["CMD", "bun", "healthcheck.mjs"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s

  stop_signal: SIGTERM

  # Docker's hard ceiling: SIGTERM, then SIGKILL after this. It is deliberately
  # 30s ABOVE SHUTDOWN_TIMEOUT_MS so the app always wins the race and exits on
  # its own terms, leaving the 30s as headroom for cleanup() (WAL checkpoint +
  # DB close). Raising this alone does nothing — SHUTDOWN_TIMEOUT_MS is what
  # actually bounds the drain.
  stop_grace_period: 150s

  # NOTE: `read_only: true` from the generic plan is deliberately NOT set.
  # OmniRoute writes outside the data volume at runtime: the SQLite driver
  # fallback chain installs better-sqlite3 into ~/.omniroute/runtime, and the
  # Next.js standalone server writes cache under /app. A read-only rootfs
  # breaks both. cap_drop + no-new-privileges are kept.
  cap_drop:
    - ALL

  security_opt:
    - no-new-privileges:true

  networks:
    - backend

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── BLUE ────────────────────────────────────────────────────────────────────
  app-blue:
    <<: *app
    image: ${BLUE_IMAGE}
    environment:
      <<: *app-env
      APP_SLOT: blue

  # ── GREEN ───────────────────────────────────────────────────────────────────
  app-green:
    <<: *app
    image: ${GREEN_IMAGE}
    environment:
      <<: *app-env
      APP_SLOT: green

  # ── REDIS ───────────────────────────────────────────────────────────────────
  # Shared rate-limiter / auth-cache / quota store. Optional for OmniRoute, but
  # strongly recommended here: it keeps that state OUTSIDE the app process, so a
  # blue→green switch does not reset rate-limit counters. Enable it by setting
  # REDIS_URL=redis://redis:6379 in .app.env.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── CADDY ───────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    # The Telegram Ops Bot webhook listener is a systemd service on the host, not
    # a container, because it has to stay reachable while this stack restarts.
    # host-gateway is how a bridged container reaches back to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8080"

    volumes:
      # `,z` for the same SELinux reason as the app data mount above.
      - ./caddy:/etc/caddy:ro,z
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - edge
      - backend

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── CLOUDFLARE TUNNEL ───────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run

    env_file:
      - .tunnel.env

    networks:
      - edge

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
